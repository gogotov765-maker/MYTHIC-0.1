name: Build MYTHIC
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib grub-pc-bin xorriso mtools
      - name: Build kernel and ISO
        run: make iso
      - uses: actions/upload-artifact@v4
        with:
          name: mythic
          path: |
            mythic.iso
            mythic.bin
